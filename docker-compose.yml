services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brokerd
      POSTGRES_PASSWORD: brokerd
      POSTGRES_DB: brokerd
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brokerd -d brokerd"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
