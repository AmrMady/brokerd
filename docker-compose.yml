services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brokerd
      POSTGRES_PASSWORD: brokerd
      POSTGRES_DB: brokerd
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brokerd -d brokerd"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Migrates the database, and for this demo sets the regulatory fees to
  # zero so sells work. Load the published SEC and FINRA rates for anything
  # else.
  setup:
    build: .
    environment:
      DATABASE_URL: postgres://brokerd:brokerd@postgres:5432/brokerd?sslmode=disable
    entrypoint: ["sh", "-c"]
    command:
      - brokerd migrate && brokerd fee-rate sec 2000-01-01 0 && brokerd fee-rate taf 2000-01-01 0 0
    depends_on:
      postgres:
        condition: service_healthy

  brokerd:
    build: .
    command: ["serve", "-addr", ":8080"]
    environment:
      DATABASE_URL: postgres://brokerd:brokerd@postgres:5432/brokerd?sslmode=disable
    ports:
      - "${BROKERD_PORT:-8080}:8080"
    stop_grace_period: 20s # the 5s drain delay, then up to 10s to finish
    depends_on:
      setup:
        condition: service_completed_successfully

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # kafka:9092 for the other containers, localhost:9094 for the host.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20

  outbox-publisher:
    build: .
    entrypoint: ["outbox"]
    command: ["publish"]
    environment:
      DATABASE_URL: postgres://brokerd:brokerd@postgres:5432/brokerd?sslmode=disable
      KAFKA_BROKERS: kafka:9092
    depends_on:
      setup:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  # Logs every posting and fill once: `docker compose logs -f outbox-consumer`.
  outbox-consumer:
    build: .
    entrypoint: ["outbox"]
    command: ["consume", "-group", "audit"]
    environment:
      DATABASE_URL: postgres://brokerd:brokerd@postgres:5432/brokerd?sslmode=disable
      KAFKA_BROKERS: kafka:9092
    depends_on:
      outbox-publisher:
        condition: service_started

volumes:
  pgdata:
