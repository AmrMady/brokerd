name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1

  test:
    runs-on: ubuntu-24.04
    env:
      BROKERD_TEST_DATABASE_URL: postgres://brokerd:brokerd@localhost:5432/brokerd?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Not a service container, which can't take server flags: the
      # concurrency tests need more than the default 100 connections. Ready
      # once it answers over TCP, which the server used for setup doesn't.
      - run: >-
          docker run -d --name postgres -p 5432:5432
          -e POSTGRES_USER=brokerd -e POSTGRES_PASSWORD=brokerd -e POSTGRES_DB=brokerd
          postgres:16-alpine -c max_connections=400 -c fsync=off
      - run: until docker exec postgres pg_isready -h 127.0.0.1 -U brokerd -d brokerd; do sleep 1; done
      # The tests share the one server, so fewer packages at once.
      - run: go test -race -p 2 ./...

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # Builds both binaries, the outbox's with cgo, and checks they start in
      # the runtime image.
      - run: docker build -t brokerd .
      - run: docker run --rm brokerd serve -h
      - run: docker run --rm --entrypoint outbox brokerd publish -h
